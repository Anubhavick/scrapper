name: dentists-austin-tx
enabled: true

# CAN-SPAM, per PROJECT.md's legal-posture table (US business, US leads).
legal_region: us

business_type: dentist

location:
  mode: radius
  center: "Austin, Texas, USA"
  radius_km: 15

source:
  primary: overpass
  max_results: 500

filters:
  must_have_website: true
  must_have_phone: false
  min_name_length: 3
  # OSM tags this node `dentist`, but touchto.io is a digital agency, not a
  # dental practice -- caught during the manual review of a real scrape.
  # No cross-source validation exists to catch mistagged OSM nodes
  # automatically, so this is a per-profile denylist maintained by hand
  # (or, once step 8's review UI exists, by clicking "reject").
  exclude_domains: [touchto.io]

enrichment:
  crawl_pages: [/, /contact, /about, /services]
  max_pages: 6
  signals:
    - no_https
    - no_mobile_viewport
    - no_contact_form
    - no_online_booking
    - site_platform
    - last_content_year
    - page_weight_mb
    - has_whatsapp_link

qualification:
  require_email: true
  require_any_signal: [no_online_booking, no_contact_form]
  min_signal_count: 1

outreach:
  offer_id: appointment-automation
  sender_pool: [sales1]
  daily_cap_per_mailbox: 40
