[project]
name = "leadgen"
version = "0.1.0"
description = "Lead generation and cold outreach system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.1",
    "rq>=2.0",
    "httpx>=0.27",
    "selectolax>=0.3",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
